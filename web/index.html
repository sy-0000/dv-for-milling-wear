<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WearLens</title>
<link rel="stylesheet" href="css/style.css">
<script src="lib/d3.v7.9.0.min.js"></script>
</head>
<body>
<!-- Header: brand · guided questions Q1–Q4 (+ all views) · global controls · language -->
<header class="hdr" id="bar">
  <div class="brand"><small class="mono" data-i18n="subbrand">刀具磨耗判讀</small><b class="brand-name">WearLens</b></div>
  <nav class="tabs" aria-label="Guided questions">
    <button class="tab" data-step="1"><small class="mono">Q1</small><b data-i18n="q1"></b></button>
    <button class="tab" data-step="2"><small class="mono">Q2</small><b data-i18n="q2"></b></button>
    <button class="tab" data-step="3"><small class="mono">Q3</small><b data-i18n="q3"></b></button>
    <button class="tab" data-step="4"><small class="mono">Q4</small><b data-i18n="q4"></b></button>
    <button class="tab tab-all" data-step="all"><small class="mono">ALL</small><b data-i18n="qall"></b></button>
  </nav>
  <section class="status" id="controls" aria-label="Global controls">
    <label><span class="k mono" data-i18n="feature"></span><select id="ctl-feature"></select></label>
    <label data-i18n-title="normTitle"><span class="k mono" data-i18n="norm"></span>
      <select id="ctl-norm">
        <option value="early" data-i18n="normEarly"></option>
        <option value="vbref" data-i18n="normVbref"></option>
        <option value="z" data-i18n="normZ"></option>
        <option value="raw" data-i18n="normRaw"></option>
      </select><span id="norm-badge" class="badge">production</span></label>
    <label><span class="k mono" data-i18n="vbLimit"></span><input type="range" id="ctl-thr" min="60" max="150" step="5" value="140"><output id="out-thr">140 µm</output></label>
    <label class="chk"><span class="k mono" data-i18n="dyn"></span><input type="checkbox" id="ctl-dyn" checked></label>
  </section>
  <div class="lang" role="group" aria-label="Language"><button data-lang="zh">中</button><button data-lang="en">EN</button></div>
</header>

<!-- Question bar: the active question, what to look at, machine legend, reset -->
<section class="qbar">
  <span class="qnum mono" id="q-num">Q1</span>
  <h2 id="q-title"></h2>
  <button class="info" aria-expanded="false" aria-controls="about-info" aria-label="About">ⓘ</button>
  <div class="info-body" id="about-info" hidden data-i18n="about"></div>
  <p id="q-note" class="q-note"></p>
  <div class="legend" id="legend" aria-label="Machine color legend"></div>
  <button id="ctl-reset" class="ghost" data-i18n="reset"></button>
</section>

<!-- Compromise layout: the question's main views in the centre, the other views as linked thumbnails on the left,
     the V2 scoreboard and the live conclusion on the right. Slots are moved between the columns by main.js. -->
<main class="layout" id="layout">
  <aside class="thumbs" id="thumbs" aria-label="Other views">
    <div class="col-h mono" data-i18n="thumbs"></div>
    <div id="thumb-list"></div>
    <p class="hint" data-i18n="thumbsHint"></p>
  </aside>
  <div class="mainc" id="mainc"></div>
  <aside class="score" id="score">
    <div class="slot" id="slot-v2">
      <section class="view" id="v2"><h3><span data-i18n="v2t"></span> <button class="info" aria-expanded="false" aria-controls="v2-info" aria-label="About V2">ⓘ</button> <span class="tag" data-i18n="analysis"></span></h3>
        <div class="hint info-body" id="v2-info" hidden data-i18n="i2"></div>
        <div id="v2-score"></div>
        <div class="ctl"><span data-i18n="rule"></span> <span id="v2-mode" class="seg-inline"><button data-mode="fleet" class="on" data-i18n="mFleet"></button><button data-mode="machine" data-i18n="mMachine"></button><button data-mode="machineLoo" data-i18n="mLoo"></button><button data-mode="signal" data-i18n="mSignal"></button></span></div>
        <p hidden id="v2-fixed-hint"></p>
        <div class="ctl" id="v2-signal-ctl" hidden><span data-i18n="sig1"></span>
          <input type="number" id="v2-persist" min="1" max="120" step="1" value="1" style="width:4em"> <span data-i18n="sig2"></span>
          <label><input type="radio" name="cal" value="other" checked> <span data-i18n="calOther"></span></label>
          <label><input type="radio" name="cal" value="loo"> <span data-i18n="calLoo"></span></label>
          <label><input type="radio" name="cal" value="insample"> <span data-i18n="calIn"></span></label>
          <label><input type="radio" name="cal" value="manual"> <span data-i18n="calManual"></span> <input type="number" id="v2-level" step="0.01" value="1.25" style="width:5em"></label></div>
        <div class="plot"></div><p class="summary" id="v2-summary"></p></section>
    </div>
    <div class="concl" id="concl"><small class="mono"><span data-i18n="conclLabel"></span> · <span id="concl-q"></span></small><b id="concl-title"></b><p id="concl-body"></p></div>
  </aside>
</main>

<!-- view slots (moved into the centre or the thumbnail column) -->
<div id="pool">
  <div class="slot" id="slot-v1" data-view="v1"><div class="slot-h mono"><span>V1 · <span data-i18n="v1s"></span></span><span class="open" data-i18n="open"></span></div>
    <section class="view" id="v1"><h3><span data-i18n="v1t"></span> <button class="info" aria-expanded="false" aria-controls="v1-info" aria-label="About V1">ⓘ</button></h3>
      <p class="hint info-body" id="v1-info" hidden data-i18n="i1"></p>
      <div class="plot"></div></section></div>

  <div class="slot" id="slot-v3" data-view="v3"><div class="slot-h mono"><span>V3 · <span data-i18n="v3s"></span></span><span class="open" data-i18n="open"></span></div>
    <section class="view" id="v3"><h3><span data-i18n="v3t"></span> <button class="info" aria-expanded="false" aria-controls="v3-info" aria-label="About V3">ⓘ</button> <span class="tag" data-i18n="analysis"></span></h3>
      <p class="hint info-body" id="v3-info" hidden data-i18n="i3"></p>
      <div class="ctl"><span data-i18n="sortBy"></span> <span id="v3-sort" class="seg-inline"><button data-sort="min" class="on" data-i18n="sortMin"></button><button data-sort="pooled" data-i18n="sortPooled"></button></span></div>
      <div class="plot"></div></section></div>

  <div class="slot" id="slot-v4" data-view="v4"><div class="slot-h mono"><span>V4 · <span data-i18n="v4s"></span></span><span class="open" data-i18n="open"></span></div>
    <section class="view" id="v4"><h3><span data-i18n="v4t"></span> <button class="info" aria-expanded="false" aria-controls="v4-info" aria-label="About V4">ⓘ</button></h3>
      <p class="hint info-body" id="v4-info" hidden data-i18n="i4"></p>
      <div class="ctl"><label><input type="checkbox" id="v4-lines" checked> <span data-i18n="trend"></span></label></div>
      <div class="plot"></div></section></div>

  <div class="slot" id="slot-v5" data-view="v5"><div class="slot-h mono"><span>V5 · <span data-i18n="v5s"></span></span><span class="open" data-i18n="open"></span></div>
    <section class="view" id="v5"><h3><span data-i18n="v5t"></span> <select id="v5-tool"></select> <button class="info" aria-expanded="false" aria-controls="v5-info" aria-label="About V5">ⓘ</button> <span class="tag" data-i18n="analysis"></span></h3>
      <p class="hint info-body" id="v5-info" hidden data-i18n="i5"></p>
      <div class="ctl"><label><span data-i18n="jump"></span> <input type="range" id="ctl-jump" min="2" max="30" step="1" value="5"> <output id="out-jump">5 %</output></label>
        <label><span data-i18n="rise"></span> <input type="range" id="ctl-rise" min="5" max="60" step="1" value="20"> <output id="out-rise">20 %</output></label>
        <b id="v5-count"></b></div>
      <div class="plot"></div></section></div>

  <div class="slot" id="slot-v6" data-view="v6"><div class="slot-h mono"><span>V6 · <span data-i18n="v6s"></span></span><span class="open" data-i18n="open"></span></div>
    <section class="view" id="v6"><h3><span data-i18n="v6t"></span> <button class="info" aria-expanded="false" aria-controls="v6-info" aria-label="About V6">ⓘ</button></h3>
      <p class="hint info-body" id="v6-info" hidden data-i18n="i6"></p>
      <p class="hint" id="v6-head"></p>
      <div class="plot"></div></section></div>
</div>

<footer class="foot">
  <details><summary data-i18n="limits"></summary>
    <p id="limitations"></p>
    <p>Data: Denkena, Klemme &amp; Stiehl (2023), <i>Data in Brief</i> 50:109574 · Mendeley Data doi:10.17632/zpxs87bjt8 (CC BY 4.0). Built with D3.js v7.9.0.</p>
  </details>
</footer>
<div id="tooltip" role="tooltip" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
